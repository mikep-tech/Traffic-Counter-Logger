<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter Field Logger</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; background: #f4f6f8; margin: 0; }
    .card { background: white; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 16px; }
    h2 { margin-top: 0; color: #1a202c; font-size: 1.25rem; }
    label { display: block; margin: 12px 0 4px; font-weight: 600; color: #4a5568; font-size: 0.9rem; }
    input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
    button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 12px; }
    .btn-primary { background: #3182ce; color: white; }
    .btn-success { background: #38a169; color: white; }
    .btn-secondary { background: #e2e8f0; color: #2d3748; }
    .count-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .badge { background: #ebf8ff; color: #2b6cb0; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
    
    /* Readiness Badges */
    .status-box { padding: 12px; border-radius: 8px; margin-top: 10px; font-size: 0.95rem; font-weight: 600; }
    .status-ready { background-color: #def7ec; color: #03543f; border: 1px solid #84e1bc; }
    .status-warn { background-color: #fdf6b2; color: #723b10; border: 1px solid #faca15; }
    .status-wait { background-color: #fde8e8; color: #9b1c1c; border: 1px solid #f8b4b4; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Counter Data Entry</h2>

    <label>Action Type</label>
    <select id="actionType" onchange="handleActionChange()">
      <option value="Deployment">Deployment</option>
      <option value="Pickup">Pickup</option>
    </select>
    
    <!-- Station Selector / Input -->
    <div id="stationGroup">
      <label id="stationLabel">Station #</label>
      <input type="text" id="stationNum" placeholder="e.g. ST-101">
      <select id="activeStationSelect" style="display:none;" onchange="autoFillPickupFields()">
        <option value="">-- Choose Active Station --</option>
      </select>
    </div>

    <!-- Deployment Counter Input with Fleet Datalist -->
    <div id="deployCounterGroup">
      <label>Barcode / Counter ID</label>
      <input type="text" id="counterId" list="counterList" placeholder="Type or select Counter ID">
      <datalist id="counterList">
        <option value="101361"><option value="100825"><option value="100097"><option value="100543">
        <option value="101485"><option value="103709"><option value="108771"><option value="100423">
        <option value="100547"><option value="100542"><option value="100783"><option value="104158">
        <option value="100419"><option value="103815"><option value="100425"><option value="100966">
        <option value="100521"><option value="100523"><option value="100528"><option value="103772">
        <option value="100458"><option value="101289"><option value="100417"><option value="100455">
        <option value="100957"><option value="100794"><option value="100967"><option value="102129">
        <option value="100495"><option value="100822"><option value="100792"><option value="103710">
        <option value="100520"><option value="102124"><option value="100400"><option value="101184">
        <option value="100412"><option value="100394"><option value="100388"><option value="100525">
        <option value="100814"><option value="100602"><option value="100524"><option value="100585">
        <option value="100438"><option value="100420"><option value="100705"><option value="104172">
        <option value="100730"><option value="103740"><option value="100826"><option value="100549">
        <option value="103766"><option value="100529"><option value="100392"><option value="103739">
        <option value="100546"><option value="103769"><option value="100548"><option value="100664">
        <option value="100522">
      </datalist>
    </div>

    <!-- Pickup Display for Counter ID & Readiness Status -->
    <div id="pickupCounterDisplay" style="display: none;">
      <div id="statusBox" class="status-box status-wait">
        <span id="displayCounterId">Select a station above</span>
      </div>
    </div>

    <!-- Dynamic Pickup Counts -->
    <div id="countsContainer" class="count-grid" style="display: none; margin-top: 8px;">
      <div>
        <label>24-Hr Count</label>
        <input type="number" id="count24" placeholder="0">
      </div>
      <div>
        <label>48-Hr Count</label>
        <input type="number" id="count48" placeholder="0">
      </div>
    </div>

    <label>Notes / Site Description</label>
    <input type="text" id="notes" placeholder="e.g. Northbound lane near main intersection">

    <button class="btn-primary" id="saveBtn" onclick="logEntry()">Save Deployment</button>
  </div>

  <div class="card">
    <h2>Weekly Summary (<span id="recordCount">0</span> records)</h2>
    <p style="font-size: 0.85rem; color: #718096;">Active Deployments in Field: <span id="activeCount" class="badge">0</span></p>
    <button class="btn-success" onclick="exportToCSV()">Export CSV Spreadsheet</button>
    <button class="btn-secondary" onclick="clearData()">Clear All Data</button>
  </div>

  <script>
    function handleActionChange() {
      const action = document.getElementById('actionType').value;
      const deployGrp = document.getElementById('deployCounterGroup');
      const pickupDisplay = document.getElementById('pickupCounterDisplay');
      const countsContainer = document.getElementById('countsContainer');
      const saveBtn = document.getElementById('saveBtn');
      const stationInput = document.getElementById('stationNum');
      const stationSelect = document.getElementById('activeStationSelect');

      if (action === 'Deployment') {
        deployGrp.style.display = 'block';
        pickupDisplay.style.display = 'none';
        countsContainer.style.display = 'none';
        stationInput.style.display = 'block';
        stationSelect.style.display = 'none';
        saveBtn.innerText = 'Save Deployment';
      } else {
        deployGrp.style.display = 'none';
        pickupDisplay.style.display = 'block';
        countsContainer.style.display = 'grid';
        stationInput.style.display = 'none';
        stationSelect.style.display = 'block';
        saveBtn.innerText = 'Save Pickup & Update Row';
        populateActiveStations();
      }
    }

    function populateActiveStations() {
      const logs = JSON.parse(localStorage.getItem('counter_logs') || '[]');
      const select = document.getElementById('activeStationSelect');
      select.innerHTML = '<option value="">-- Choose Active Station --</option>';

      const now = new Date();

      logs.forEach((item, index) => {
        if (item.status === 'Deployed') {
          const deployDate = new Date(item.deployIsoTime || item.deployTime);
          const elapsedHours = (now - deployDate) / (1000 * 60 * 60);
          
          let tag = elapsedHours >= 48 ? '🟢 READY (48h+)' : `🟡 ${Math.floor(elapsedHours)}h elapsed`;

          const opt = document.createElement('option');
          opt.value = index;
          opt.innerText = `Station: ${item.station} | ${tag}`;
          select.appendChild(opt);
        }
      });
      
      const statusBox = document.getElementById('statusBox');
      statusBox.className = 'status-box status-wait';
      document.getElementById('displayCounterId').innerText = 'Select a station above to view details';
    }

    function autoFillPickupFields() {
      const selectIndex = document.getElementById('activeStationSelect').value;
      const statusBox = document.getElementById('statusBox');
      const displaySpan = document.getElementById('displayCounterId');

      if (selectIndex === "") {
        statusBox.className = 'status-box status-wait';
        displaySpan.innerText = 'Select a station above to view details';
        return;
      }

      const logs = JSON.parse(localStorage.getItem('counter_logs') || '[]');
      const record = logs[selectIndex];

      if (record) {
        const deployDate = new Date(record.deployIsoTime || record.deployTime);
        const now = new Date();
        const diffMs = now - deployDate;
        
        const totalMinutes = Math.floor(diffMs / (1000 * 60));
        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;

        let statusText = `Counter: ${record.id}<br>Deployed: ${record.deployTime}<br>Time Elapsed: ${hours}h ${minutes}m`;

        if (hours >= 48) {
          statusBox.className = 'status-box status-ready';
          displaySpan.innerHTML = `✅ <strong>READY FOR PICKUP (48+ hrs)</strong><br>${statusText}`;
        } else if (hours >= 24) {
          statusBox.className = 'status-box status-warn';
          displaySpan.innerHTML = `⚠️ <strong>24-HR MARK REACHED (${hours}h elapsed)</strong><br>${statusText}`;
        } else {
          statusBox.className = 'status-box status-wait';
          displaySpan.innerHTML = `⏳ <strong>NOT READY YET (${hours}h elapsed)</strong><br>${statusText}`;
        }
      }
    }

    function logEntry() {
      const actionType = document.getElementById('actionType').value;
      const notes = document.getElementById('notes').value;

      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (position) => { processSave(actionType, notes, position.coords.latitude, position.coords.longitude); },
          (error) => { processSave(actionType, notes, "", ""); },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      } else {
        processSave(actionType, notes, "", "");
      }
    }

    function processSave(actionType, notes, lat, lng) {
      let logs = JSON.parse(localStorage.getItem('counter_logs') || '[]');
      const now = new Date();
      const timestamp = now.toLocaleString();
      const isoTime = now.toISOString();
      const mapsUrl = lat && lng ? `https://maps.google.com/?q=${lat},${lng}` : "";

      if (actionType === 'Deployment') {
        const stationNum = document.getElementById('stationNum').value;
        const counterId = document.getElementById('counterId').value;

        if (!stationNum || !counterId) {
          alert("Please fill in both Station # and Counter ID.");
          return;
        }

        const newRecord = {
          status: 'Deployed',
          station: stationNum,
          id: counterId,
          deployTime: timestamp,
          deployIsoTime: isoTime,
          deployLat: lat,
          deployLng: lng,
          deployMapsUrl: mapsUrl,
          deployNotes: notes,
          pickupTime: '',
          count24: '',
          count48: '',
          pickupLat: '',
          pickupLng: '',
          pickupMapsUrl: '',
          pickupNotes: ''
        };

        logs.push(newRecord);

      } else if (actionType === 'Pickup') {
        const selectIndex = document.getElementById('activeStationSelect').value;
        const count24 = document.getElementById('count24').value;
        const count48 = document.getElementById('count48').value;

        if (selectIndex === "") {
          alert("Please select an active station for pickup.");
          return;
        }

        logs[selectIndex].status = 'Completed';
        logs[selectIndex].pickupTime = timestamp;
        logs[selectIndex].count24 = count24 || 0;
        logs[selectIndex].count48 = count48 || 0;
        logs[selectIndex].pickupLat = lat;
        logs[selectIndex].pickupLng = lng;
        logs[selectIndex].pickupMapsUrl = mapsUrl;
        logs[selectIndex].pickupNotes = notes;
      }

      localStorage.setItem('counter_logs', JSON.stringify(logs));

      // Reset fields
      document.getElementById('stationNum').value = '';
      document.getElementById('counterId').value = '';
      document.getElementById('count24').value = '';
      document.getElementById('count48').value = '';
      document.getElementById('notes').value = '';

      updateCounts();
      if (actionType === 'Pickup') populateActiveStations();
      alert("Record saved successfully!");
    }

    function updateCounts() {
      const logs = JSON.parse(localStorage.getItem('counter_logs') || '[]');
      document.getElementById('recordCount').innerText = logs.length;
      
      const activeCount = logs.filter(row => row.status === 'Deployed').length;
      document.getElementById('activeCount').innerText = activeCount;
    }

    function exportToCSV() {
      const logs = JSON.parse(localStorage.getItem('counter_logs') || '[]');
      if (logs.length === 0) {
        alert("No records to export.");
        return;
      }

      let csv = "Status,Station #,Counter ID,Deploy Timestamp,Deploy Maps Link,Deploy Notes,Pickup Timestamp,24-Hr Count,48-Hr Count,Pickup Maps Link,Pickup Notes\n";
      
      logs.forEach(row => {
        csv += `"${row.status}","${row.station}","${row.id}","${row.deployTime}","${row.deployMapsUrl}","${row.deployNotes}","${row.pickupTime}","${row.count24}","${row.count48}","${row.pickupMapsUrl}","${row.pickupNotes}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `weekly_traffic_counts_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function clearData() {
      if (confirm("Are you sure you want to clear all logged data for this week?")) {
        localStorage.removeItem('counter_logs');
        updateCounts();
        populateActiveStations();
      }
    }

    updateCounts();
    handleActionChange();
  </script>
</body>
</html>
